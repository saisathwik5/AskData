# AskData Java Query Guard Service Configuration
# Default to 8081 to avoid conflict with standard 8080 web services
server.port=${PORT:8081}

# Primary Read-Only Data Source (queries run with this limited user)
spring.datasource.url=${SUPABASE_READONLY_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_READONLY_USER:askdata_readonly}
spring.datasource.password=${SUPABASE_READONLY_PASSWORD:AskDataReadonly2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# Admin Data Source for writing to query_audit_logs (uses admin url or main connection)
askdata.admin.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}

# Guard Security Rules
guard.max-row-limit=1000
guard.statement-timeout-seconds=5
